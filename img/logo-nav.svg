<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 348 70" width="348" height="70" overflow="visible" aria-hidden="true">
  <defs>
    <linearGradient id="cursolandiaGradNav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="proGradNav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Isotipo: misma geometría que logo2.svg (translate 10,8) -->
  <g transform="translate(10, 8)">
    <path
      d="M 46 8 A 28 28 0 1 0 54 44"
      fill="none"
      stroke="url(#cursolandiaGradNav)"
      stroke-width="7"
      stroke-linecap="round"
    />
    <polygon points="46,4 58,10 46,16 34,10" fill="#60A5FA"/>
    <g transform="translate(32, 28)">
      <circle cx="16" cy="16" r="14" fill="#34D399"/>
      <polygon points="12,30 20,27 16,33" fill="#34D399"/>
      <path
        d="M 11 16 L 15 20 L 22 13"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
    <circle cx="10" cy="10" r="3" fill="url(#proGradNav)"/>
  </g>

  <!-- Tipografía: mismas posiciones que logo2, sin bajada -->
  <g transform="translate(90, 48)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="0" y="0" font-size="34" font-weight="600" fill="#F8FAFC" letter-spacing="-0.5">Curso</text>
    <text x="96" y="0" font-size="34" font-weight="800" fill="url(#cursolandiaGradNav)" letter-spacing="-0.5">landia</text>
    <text x="202" y="-12" font-size="14" font-weight="700" fill="#94A3B8">.com</text>
  </g>
